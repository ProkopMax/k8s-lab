---
- name: Create GitLab Runner namespace
  become: false
  kubernetes.core.k8s:
    kubeconfig: "{{ gitlab_runner_kubeconfig }}"
    context: "{{ gitlab_runner_context | default(omit, true) }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitlab_runner_namespace }}"
        labels:
          app.kubernetes.io/name: gitlab-runner
          app.kubernetes.io/managed-by: ansible