---
- name: Create GitLab Runner CA secret
  become: false
  kubernetes.core.k8s:
    kubeconfig: "{{ gitlab_runner_kubeconfig }}"
    context: "{{ gitlab_runner_context | default(omit, true) }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gitlab_runner_tls_secret_name }}"
        namespace: "{{ gitlab_runner_namespace }}"
        labels:
          app.kubernetes.io/name: gitlab-runner
          app.kubernetes.io/managed-by: ansible
      type: Opaque
      data: >-
        {{
          {
            gitlab_runner_ca_cert_key:
            lookup('ansible.builtin.file', gitlab_runner_ca_cert_file) | b64encode
          }
        }}
  no_log: true

- name: Validate Instance Runner tokens
  ansible.builtin.assert:
    that:
      - vault_gitlab_runner_buildkit_token is defined
      - vault_gitlab_runner_buildah_token is defined
      - vault_gitlab_runner_buildkit_token.startswith('glrt-')
      - vault_gitlab_runner_buildah_token.startswith('glrt-')
    fail_msg: "Valid GitLab Instance Runner authentication tokens are required."

- name: Create BuildKit Runner token Secret
  become: false
  kubernetes.core.k8s:
    kubeconfig: "{{ gitlab_runner_kubeconfig }}"
    context: "{{ gitlab_runner_context | default(omit, true) }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gitlab_runner_token_secrets.buildkit }}"
        namespace: "{{ gitlab_runner_namespace }}"
        labels:
          app.kubernetes.io/name: gitlab-runner
          app.kubernetes.io/managed-by: ansible
      type: Opaque
      stringData:
        runner-token: "{{ vault_gitlab_runner_buildkit_token }}"
        runner-registration-token: ""
  no_log: true

- name: Create Buildah Runner token Secret
  become: false
  kubernetes.core.k8s:
    kubeconfig: "{{ gitlab_runner_kubeconfig }}"
    context: "{{ gitlab_runner_context | default(omit, true) }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gitlab_runner_token_secrets.buildah }}"
        namespace: "{{ gitlab_runner_namespace }}"
        labels:
          app.kubernetes.io/name: gitlab-runner
          app.kubernetes.io/managed-by: ansible
      type: Opaque
      stringData:
        runner-token: "{{ vault_gitlab_runner_buildah_token }}"
        runner-registration-token: ""
  no_log: true