---
- name: Add GitLab package repository key
  ansible.builtin.shell: |
    curl -fsSL "{{ gitlab_repo_url }}gpgkey" | gpg --dearmor > /etc/apt/trusted.gpg.d/gitlab.gpg
  args:
    creates: /etc/apt/trusted.gpg.d/gitlab.gpg
  changed_when: false

- name: Add GitLab package repository
  ansible.builtin.apt_repository:
    repo: "deb {{ gitlab_repo_url }}ubuntu/ {{ ansible_facts['distribution_release'] }} main"
    state: present
    filename: gitlab-ce
    update_cache: true

- name: Install GitLab CE packages
  ansible.builtin.apt:
    name: "{{ gitlab_packages }}"
    state: present
    update_cache: true

- name: Create SSL directory
  ansible.builtin.file:
    path: /etc/gitlab/ssl
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy GitLab certificate
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: "../../../certs/gitlab/gitlab.k8s.lab.crt", dest: "/etc/gitlab/ssl/gitlab.k8s.lab.crt" }
    - { src: "../../../certs/registry/registry.k8s.lab.crt", dest: "/etc/gitlab/ssl/registry.k8s.lab.crt" }

- name: Copy GitLab private key
  ansible.builtin.copy:
    content: "{{ vault_gitlab_ssl_key }}"
    dest: /etc/gitlab/ssl/gitlab.k8s.lab.key
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Copy GitLab Registry private key
  ansible.builtin.copy:
    content: "{{ vault_gitlab_registry_ssl_key }}"
    dest: /etc/gitlab/ssl/registry.k8s.lab.key
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Configure GitLab
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
  notify: Reconfigure GitLab