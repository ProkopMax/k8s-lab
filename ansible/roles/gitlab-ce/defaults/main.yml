---
# Default variables for GitLab CE role

# GitLab version to install
gitlab_version: "19.4.2-ce.0"

# GitLab Omnibus package repository URL
gitlab_repo_url: "https://packages.gitlab.com/gitlab/gitlab-ce/gpgkey"

# GitLab configuration
gitlab_external_url: "https://gitlab.k8s.lab"
gitlab_time_zone: "Europe/Moscow"
gitlab_backup_keep_time: 604800

# GitLab administrator password (will be set during installation)
gitlab_admin_password: '{{ vault_gitlab_admin_password | default("ChangeMe123!") }}'

# GitLab packages to install
gitlab_packages:
  - gitlab-ce

## SSL Configuration
gitlab_ssl_certificate = "/etc/gitlab/ssl/gitlab.k8s.lab.crt"
gitlab_ssl_certificate_key = "/etc/gitlab/ssl/gitlab.k8s.lab.key"

## Disable GitLab Runner installation
gitlab_runner_enable = false

## Worker optimization
# Configure number of Sidekiq workers based on available CPU cores
gitlab_sidekiq_concurrency = 5

# Configure number of unicorn workers
gitlab_unicorn_worker_processes = 2

## Disable unnecessary services to save resources
# Disable GitLab Pages
gitlab_pages_enable = false

# Disable GitLab LDAP integration (if not needed)
gitlab_rails_ldap_enabled = false

# Disable GitLab Container Registry
gitlab_registry_enable = true

# Disable GitLab ChatOps
gitlab_chatops_enable = false

# Disable GitLab Geo
gitlab_geo_enable = false

## Additional optimizations
# Enable backup compression to save disk space
gitlab_rails_backup_compression_level = 6

# Configure backup directory
gitlab_rails_backup_path = "/var/opt/gitlab/backups"

# Set backup timeout
gitlab_rails_backup_timeout = 1800

# Enable automatic database cleanup
gitlab_rails_backup_cleanup = true

# Configure log rotation
gitlab_logging_logrotate_frequency = "daily"
gitlab_logging_logrotate_rotate = 30

## Performance optimizations
# Enable Gzip compression in nginx
gitlab_nginx_gzip_enabled = true

# Keep GitLab email notifications enabled for system alerts
gitlab_rails_gitlab_email_enabled = false

# Configure nginx worker processes
gitlab_nginx_worker_processes = 2

# Configure nginx worker connections
gitlab_nginx_worker_connections = 1024

# Enable GitLab's built-in Prometheus metrics
gitlab_rails_prometheus_enabled = true