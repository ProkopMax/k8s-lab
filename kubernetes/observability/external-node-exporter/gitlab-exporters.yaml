# GitLab Node Exporter
apiVersion: v1
kind: Endpoints
metadata:
  name: gitlab-node-exporter
  namespace: observability
subsets:
  - addresses:
      - ip: 192.168.122.104
    ports:
      - name: metrics
        port: 9100
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-node-exporter
  namespace: observability
  labels:
    app: gitlab-node-exporter
spec:
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitlab-node-exporter
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: gitlab-node-exporter
  endpoints:
    - port: metrics
      interval: 30s
---
