apiVersion: v1
kind: Service
metadata:
  name: loki-external
  namespace: observability
  annotations:
    metallb.io/loadBalancerIPs: 192.168.122.201
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP