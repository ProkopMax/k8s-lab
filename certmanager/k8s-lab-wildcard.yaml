apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-lab-wildcard
  namespace: gateway-system
spec:
  secretName: k8s-lab-tls

  duration: 8760h
  renewBefore: 720h

  privateKey:
    algorithm: RSA
    size: 2048

  dnsNames:
    - "*.k8s.lab"
    - "k8s.lab"

  issuerRef:
    name: k8s-lab-ca
    kind: ClusterIssuer
    group: cert-manager.io